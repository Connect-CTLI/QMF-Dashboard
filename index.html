    linear-gradient(160deg,#001489 0%,#000b4d 100%);}
.stage{width:100%;max-width:520px}
.card{background:var(--card);border-radius:20px;overflow:hidden;box-shadow:0 30px 70px rgba(0,0,0,.34),0 2px 6px rgba(0,0,0,.18)}
.rule{height:6px;background:linear-gradient(90deg,var(--gold) 0 34%,#92ad12 34% 67%,#00A1A3 67% 100%)}
.inner{padding:42px 38px 34px;text-align:center}
.logo{width:100%;max-width:270px;height:auto;margin:0 auto 28px;display:block}
.eyebrow{font-size:11px;letter-spacing:.2em;text-transform:uppercase;color:var(--soft);font-weight:500}
h1{font-family:'Century Gothic','Jost','Questrial',sans-serif;font-weight:600;font-size:28px;line-height:1.2;
  margin:11px 0 0;letter-spacing:-.015em}
.go{display:block;margin-top:28px;background:var(--blue);color:#fff;text-decoration:none;border-radius:13px;
  padding:18px 24px;font-size:17px;font-weight:600;box-shadow:0 8px 20px rgba(0,20,137,.30);
  transition:transform .16s,box-shadow .16s,background .16s}
.go:hover{background:var(--deep);transform:translateY(-2px);box-shadow:0 14px 28px rgba(0,20,137,.38)}
.go:active{transform:translateY(0)}
.arrow{display:inline-block;margin-left:8px;transition:transform .16s}
.go:hover .arrow{transform:translateX(4px)}
.split{display:flex;align-items:center;gap:14px;margin:26px 0 18px}
.split:before,.split:after{content:"";flex:1;height:1px;background:var(--line)}
.split span{font-size:10.5px;letter-spacing:.16em;text-transform:uppercase;color:var(--soft)}
.forms{display:flex;flex-wrap:wrap;gap:12px}
.form{min-width:150px}
.form{flex:1;display:flex;align-items:center;justify-content:center;text-align:center;min-height:58px;background:var(--chip);border:1px solid var(--line);border-radius:12px;
  padding:15px 14px;text-decoration:none;color:var(--ink);transition:border-color .16s,transform .16s,background .16s}
.form:hover{border-color:var(--blue);background:var(--card);transform:translateY(-2px)}
.form b{display:block;font-size:14.5px;font-weight:600;line-height:1.3}
.foot{text-align:center;margin-top:20px;font-size:12.5px;color:rgba(255,255,255,.62);letter-spacing:.03em}
@media(max-width:480px){.inner{padding:32px 24px 28px}h1{font-size:23px}.go{font-size:16px;padding:16px 20px}.forms{flex-direction:column}}
@media(prefers-reduced-motion:reduce){*{transition:none!important}}
:focus-visible{outline:3px solid var(--gold);outline-offset:3px}
</style>
</head>
